<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Alien Survivor 3D</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" class="hidden">HP <span id="hp">100</span></div>
  <div id="menu" class="overlay">
    <h1>Alien Survivor 3D</h1>
    <p>Prueba de cámara cenital. El movimiento sigue siendo plano. Las naves son mallas 3D.</p>
    <button class="btn" id="startBtn" type="button">EMPEZAR</button>
  </div>
  <div id="over" class="overlay hidden">
    <h1 class="bad">Caíste</h1>
    <button class="btn" id="retryBtn" type="button">REINTENTAR</button>
  </div>
</div>
<div id="pad" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <button id="useBomb" type="button">💣 <span id="bombN">2</span></button>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
